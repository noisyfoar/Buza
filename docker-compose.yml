name: buza

services:
  app:
    build:
      context: .
    container_name: buza-app
    restart: unless-stopped
    ports:
      - "5179:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      PORT: "8080"
      Jwt__Issuer: "BuzaStartup"
      Jwt__Audience: "BuzaStartup.Admin"
      Jwt__Secret: "docker_compose_demo_secret_1234567890_1234567890"
      Jwt__ExpiresMinutes: "720"
      ConnectionStrings__DefaultConnection: "Data Source=/data/database.db"
    volumes:
      - buza_data:/data

volumes:
  buza_data:
