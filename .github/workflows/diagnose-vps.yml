name: Diagnose Buza VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy Buza to VPS
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: buza-vps-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Collect VPS diagnostics
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -eu
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set +e
          section() { printf '\n===== %s =====\n' "$1"; }

          section 'Server time and identity'
          date -u
          id

          section 'Docker containers'
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' 2>&1
          docker inspect --format '{{.Name}} state={{.State.Status}} restarts={{.RestartCount}}' buza-vps-caddy buza-vps-app 2>&1

          section 'Listening web ports'
          ss -lntp 2>&1 | grep -E ':(80|443)([[:space:]]|$)' || true

          section 'Firewall status'
          sudo -n ufw status verbose 2>&1 || true

          section 'Caddy configuration validation'
          docker exec buza-vps-caddy caddy validate --config /etc/caddy/Caddyfile 2>&1

          REMOTE

      - name: Probe HTTPS from Russian Check-Host nodes
        id: checkhost
        run: |
          set +e
          ip_response=$(curl -sS --max-time 15 -H 'Accept: application/json' \
            'https://check-host.net/check-http?host=https%3A%2F%2F89.111.152.194%2F&node=ru1.node.check-host.net&node=ru2.node.check-host.net&node=ru3.node.check-host.net')
          ip_status=$?
          domain_response=$(curl -sS --max-time 15 -H 'Accept: application/json' \
            'https://check-host.net/check-http?host=https%3A%2F%2F89-111-152-194.sslip.io%2F&node=ru1.node.check-host.net&node=ru2.node.check-host.net&node=ru3.node.check-host.net')
          domain_status=$?
          ip_id=$(printf '%s' "$ip_response" | jq -r 'select(type == "object") | .request_id // empty' 2>/dev/null)
          domain_id=$(printf '%s' "$domain_response" | jq -r 'select(type == "object") | .request_id // empty' 2>/dev/null)
          if [ "$ip_status" -ne 0 ] || [ "$domain_status" -ne 0 ] || [ -z "$ip_id" ] || [ -z "$domain_id" ]; then
            echo 'Check-Host rate-limited or returned a non-JSON response; continuing with VPS log collection.'
            printf 'IP response: %s\nSNI response: %s\n' "$ip_response" "$domain_response"
            exit 0
          fi
          echo "IP report: https://check-host.net/check-report/$ip_id"
          echo "SNI report: https://check-host.net/check-report/$domain_id"
          sleep 16
          echo '===== Russian Check-Host HTTPS result by IP ====='
          curl -fsS --max-time 15 -H 'Accept: application/json' \
            "https://check-host.net/check-result-extended/$ip_id" | jq .
          echo '===== Russian Check-Host HTTPS result by hostname ====='
          curl -fsS --max-time 15 -H 'Accept: application/json' \
            "https://check-host.net/check-result-extended/$domain_id" | jq .

      - name: Collect Caddy logs after Russian probes
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -eu
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" 'docker logs --since 5m --tail 160 buza-vps-caddy 2>&1' | \
            sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[ip]/g'

      - name: Test public HTTP and TLS from GitHub runner
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          set +e
          echo '===== HTTP port 80 ====='
          curl -4 -sS -o /dev/null -w 'status=%{http_code} connect=%{time_connect}s total=%{time_total}s remote=%{remote_ip}\n' \
            --connect-timeout 5 --max-time 12 "http://$VPS_HOST/"
          echo "curl_exit=$?"
          echo '===== HTTPS port 443 / TLS ====='
          curl -4 -k -v -o /dev/null -w '\nstatus=%{http_code} connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s remote=%{remote_ip}\n' \
            --connect-timeout 5 --max-time 20 "https://$VPS_HOST/" 2>&1
          echo "curl_exit=$?"
          echo '===== HTTPS temporary DNS hostname / SNI ====='
          curl -4 -k -v -o /dev/null -w '\nstatus=%{http_code} connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s remote=%{remote_ip}\n' \
            --connect-timeout 5 --max-time 20 "https://89-111-152-194.sslip.io/" 2>&1
          echo "curl_exit=$?"
